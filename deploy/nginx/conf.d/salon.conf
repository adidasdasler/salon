# Internal Docker Nginx — receives proxied traffic from the host facade on :80
# and routes by Host header:
#   salon.ru / www.salon.ru      -> marketing SPA
#   app.salon.ru                 -> dashboard SPA (CRM)
#   api.salon.ru                 -> NestJS backend (:4000)
#   *.salon.ru (other subdomains)-> public booking widget SPA

# --- security headers (applied to all server blocks) ---
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# --- upstreams ---
upstream backend {
  server backend:4000;
  keepalive 32;
}

# --- api.salon.ru ---
server {
  listen 80;
  server_name api.salon.ru;

  location / {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # WebSocket support (Socket.io)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    read_timeout 75s;
  }
}

# --- salon.ru / www.salon.ru — marketing ---
server {
  listen 80;
  server_name salon.ru www.salon.ru;

  root /usr/share/nginx/marketing;
  index index.html;

  # HashRouter app — SPA fallback not strictly needed, but safe
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|svg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}

# --- app.salon.ru — CRM dashboard ---
server {
  listen 80;
  server_name app.salon.ru;

  root /usr/share/nginx/dashboard;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|svg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}

# --- {salon}.salon.ru — public booking widget (catch-all subdomain) ---
server {
  listen 80;
  server_name ~^(?<sub>[a-z0-9-]+)\.salon\.ru$;

  root /usr/share/nginx/booking;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # API calls from widget go through same host path for simplicity in dev
  location /api/ {
    proxy_pass http://backend/;
    proxy_set_header Host api.salon.ru;
    proxy_set_header X-Tenant-Subdomain $sub;
  }
}
