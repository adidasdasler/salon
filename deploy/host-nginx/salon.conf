# ============================================================================
# Хостовой Nginx — ФАСАД SALON (spec §10.3). Кидать в /etc/nginx/conf.d/salon.conf
# НЕ трогает другие сайты/боты на хосте. TLS терминируется здесь (Certbot).
# ============================================================================

# Rate limiting zones (spec §9.3)
limit_req_zone $binary_remote_addr zone=salon_api:10m   rate=10r/s;
limit_req_zone $binary_remote_addr zone=salon_auth:10m  rate=5r/m;
limit_req_zone $binary_remote_addr zone=salon_public:10m rate=20r/s;

# Common security headers on the facade (HSTS etc.)
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# --- HTTP -> HTTPS -----------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name salon.ru www.salon.ru app.salon.ru api.salon.ru *.salon.ru;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# --- TLS (certs from certbot --dns-... wildcard *.salon.ru + salon.ru) ------
# 443 only; wildcard cert covers *.salon.ru, separate cert for apex salon.ru.
server {
    listen 443 ssl http2;
    server_name salon.ru www.salon.ru;
    ssl_certificate     /etc/letsencrypt/live/salon.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salon.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # API на том же фасаде: api.salon.ru и /v1 с app-домена
    location /v1/ {
        limit_req zone=salon_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        limit_req zone=salon_public burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;   # docker nginx отдаёт marketing SPA
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl http2;
    server_name app.salon.ru;
    ssl_certificate     /etc/letsencrypt/live/salon.ru/fullchain.pem; # wildcard
    ssl_certificate_key /etc/letsencrypt/live/salon.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location /v1/ {
        limit_req zone=salon_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;   # docker nginx выбирает dashboard по Host
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl http2;
    server_name ~^(?<tenant>[a-z0-9-]+)\.salon\.ru$;   # публичные виджеты
    ssl_certificate     /etc/letsencrypt/live/salon.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salon.ru/privkey.pem;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location /v1/public/ {
        limit_req zone=salon_public burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;   # docker nginx выбирает booking SPA по Host
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
